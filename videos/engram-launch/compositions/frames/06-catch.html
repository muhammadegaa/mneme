        // ── single deterministic driver: prompt type-on + caret + "seen 18×" glow ──
        const promptText = document.getElementById("prompt-text");

        const seen = document.getElementById("seen");
        const PROMPT = "agent → engram_review(diff)";
        const P_START = 0.4,
          P_END = 2.2,
          CARET_OFF = 2.6;
        // seen-18× glow: attack to peak, then HOLD lit through the dead-still climax
        const G_START = 13.1,
          G_ATTACK = 0.6;
        const REST = { r: 245, g: 241, b: 232 };
        const CORAL = { r: 255, g: 92, b: 87 };
        const lerp = (a, b, t) => Math.round(a + (b - a) * t);

        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: 18,
            duration: 18,
            ease: "none",
            onUpdate: () => {
              const t = driver.t;

              // prompt type-on
              let n;
              if (t < P_START) n = 0;
              else if (t >= P_END) n = PROMPT.length;
              else n = Math.floor(((t - P_START) / (P_END - P_START)) * PROMPT.length);
              promptText.textContent = PROMPT.slice(0, n);

              // caret: solid while typing, blink after, gone once output begins
              if (t >= P_START && t < CARET_OFF) {
                const typing = t < P_END;
                caret.style.opacity = typing
                  ? "1"
                  : Math.sin((t / 0.53) * Math.PI * 2) > 0
                    ? "1"
                    : "0";
              } else {
                caret.style.opacity = "0";
              }

              // seen 18× — climbs to coral + glow, then holds (climax reads in stillness)
              const e = t < G_START ? 0 : Math.min((t - G_START) / G_ATTACK, 1);
              seen.style.color =
                "rgb(" +
                lerp(REST.r, CORAL.r, e) +
                "," +
                lerp(REST.g, CORAL.g, e) +
                "," +
                lerp(REST.b, CORAL.b, e) +
                ")";
              seen.style.textShadow = "0 0 " + (e * 22).toFixed(1) + "px rgba(255,92,87," + (e * 0.75).toFixed(3) + ")";
              seen.style.transform = "scale(" + (1 + e * 0.06).toFixed(3) + ")";
            },
          },
          0,
        );
