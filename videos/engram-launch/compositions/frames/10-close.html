<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata for the source file only; the HyperFrames runtime clones ONLY <template>.
         Fonts: Fraunces + JetBrains Mono are bundled in the renderer and resolve offline by name
         (frame.md → Known Gaps) — no Google Fonts / network @font-face is used (determinism). -->
  </head>
  <body>
    <template>
      <style>
        /* Fonts declared by name only — the renderer embeds Fraunces + JetBrains Mono (weights 400/700).
           @font-face here maps the family names to the bundled faces via local() so no network fetch
           happens at render; if a face is missing it falls back to the old-style serif / mono stacks. */
        @font-face {
          font-family: "Fraunces";
          src: local("Fraunces");
          font-weight: 400;
          font-display: swap;
        }
        @font-face {
          font-family: "JetBrains Mono";
          src: local("JetBrains Mono");
          font-weight: 400 500;
          font-display: swap;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          background: #0e0e10;
          font-family: "Fraunces", Georgia, serif;
        }

        /* Full-bleed near-black bg as a timed clip layer (per hard rule — not #root). */
        #bg {
          position: absolute;
          inset: 0;
          background: #0e0e10;
        }

        .stage {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          background: transparent;
        }

        /* ---- Phase 1 · proof line ---- */
        #proofWrap {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .proofline {
          width: 1460px;
          text-align: left;
          white-space: nowrap;
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 30px;
          line-height: 1.5;
          letter-spacing: 0.01em;
          color: #f5f1e8;
        }
        #pb {
          display: inline-block;
          color: #5db872; /* status success — decoration, not the brand coral */
          transform-origin: 50% 60%;
          will-change: transform;
        }
        #caret {
          display: inline-block;
          width: 13px;
          height: 32px;
          margin-left: 5px;
          vertical-align: -5px;
          background: #f5f1e8;
          opacity: 0;
        }
        #chip {
          margin-top: 36px;
          padding: 11px 22px;
          border: 1px solid rgba(245, 241, 232, 0.16);
          border-radius: 9999px;
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 22px;
          letter-spacing: 0.05em;
          color: #f5f1e8;
          opacity: 0;
        }

        /* ---- Phase 2/3 · wordmark lockup ---- */
        #lockupWrap {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #lockupInner {
          display: flex;
          flex-direction: column;
          align-items: center;
          will-change: transform;
        }
        .wordmark {
          display: flex;
          align-items: flex-start;
          font-family: "Fraunces", Georgia, serif;
          font-weight: 400;
          font-size: 158px;
          line-height: 1.0;
          letter-spacing: -0.022em;
          color: #f5f1e8;
        }
        .wordmark .ltr {
          display: inline-block;
          opacity: 0;
          will-change: transform;
        }
        #spike {
          display: inline-block;
          margin-left: 20px;
          margin-top: 16px;
          font-size: 66px;
          line-height: 1;
          color: #ff5c57; /* the ONE coral voltage moment */
          opacity: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .tagline {
          margin-top: 34px;
          font-family: "Fraunces", Georgia, serif;
          font-weight: 400;
          font-size: 46px;
          letter-spacing: -0.008em;
          color: #8a8a8a;
        }
        .tagline .wd {
          display: inline-block;
          opacity: 0;
          will-change: transform;
        }
        #footer {
          margin-top: 42px;
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 26px;
          letter-spacing: 0.045em;
          color: #8a8a8a;
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="10-close"
        data-width="1920"
        data-height="1080"
        data-duration="10"
      >
        <!-- near-black backdrop, held for the whole frame -->
        <div id="bg" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>

        <!-- Phase 1: the real proof line + chip -->
        <div
          id="proofClip"
          class="clip stage"
          data-start="0"
          data-duration="4"
          data-track-index="1"
        >
          <div id="proofWrap">
            <div class="proofline"><span id="pa"></span><span id="pb"></span><span id="pc"></span><span id="caret"></span></div>
            <div id="chip">Alibaba Cloud · ECS · Singapore</div>
          </div>
        </div>

        <!-- Phase 2/3: wordmark lockup, tagline, live URL footer -->
        <div
          id="lockupClip"
          class="clip stage"
          data-start="3"
          data-duration="7"
          data-track-index="2"
        >
          <div id="lockupWrap">
            <div id="lockupInner">
              <div class="wordmark" id="wordmark">
                <span class="ltr">E</span><span class="ltr">n</span><span class="ltr">g</span><span class="ltr">r</span><span class="ltr">a</span><span class="ltr">m</span><span id="spike">✱</span>
              </div>
              <div class="tagline" id="tagline">
                <span class="wd">the</span> <span class="wd">reviewer</span> <span class="wd">that</span> <span class="wd">remembers</span> <span class="wd">you</span>
              </div>
              <div id="footer">http://47.84.61.162 · backend=qwen · MIT</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* ---------- Phase 1 · proof line types on (mono, verbatim) ---------- */
        const A = "[1/2] Qwen/DashScope ";
        const B = "OK ✓"; // OK + the green check that lands on it
        const C = ' → "Qwen on Alibaba Cloud is reachable." · embed dims=1024';
        const TOTAL = A.length + B.length + C.length;

        const pa = document.getElementById("pa");
        const pb = document.getElementById("pb");
        const pc = document.getElementById("pc");
        const caret = document.getElementById("caret");

        const TYPE_START = 0.3;
        const TYPE_DUR = 2.0;

        // Character-slice typewriter across three coloured spans. Jitter-free caret:
        // empty spans collapse to zero width, so the caret sits at the growing edge.
        const typer = { n: 0 };
        let lastN = -1;
        tl.fromTo(
          typer,
          { n: 0 },
          {
            n: TOTAL,
            duration: TYPE_DUR,
            ease: "none",
            onUpdate: () => {
              const n = Math.floor(typer.n);
              if (n === lastN) return;
              lastN = n;
              pa.textContent = A.slice(0, Math.min(n, A.length));
              const r1 = Math.max(0, n - A.length);
              pb.textContent = B.slice(0, Math.min(r1, B.length));
              const r2 = Math.max(0, n - A.length - B.length);
              pc.textContent = C.slice(0, Math.min(r2, C.length));
            },
          },
          TYPE_START,
        );

        // Deterministic caret blink (sin square-wave, 4 whole cycles across the type window).
        const blink = { p: 0 };
        tl.fromTo(
          blink,
          { p: 0 },
          {
            p: Math.PI * 2 * 4,
            duration: TYPE_DUR,
            ease: "none",
            onUpdate: () => {
              caret.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
            },
          },
          TYPE_START,
        );
        tl.to(caret, { opacity: 0, duration: 0.05, ease: "none" }, TYPE_START + TYPE_DUR + 0.05);

        // The green check "lands" — a smooth scale pop on OK ✓ exactly when it finishes typing.
        const POP_AT = TYPE_START + ((A.length + B.length) / TOTAL) * TYPE_DUR;
        tl.fromTo(
          "#pb",
          { scale: 1 },
          {
            keyframes: [
              { scale: 1.14, duration: 0.1, ease: "power2.out" },
              { scale: 1, duration: 0.2, ease: "power3.out" },
            ],
          },
          POP_AT,
        );

        // Alibaba Cloud · ECS · Singapore chip
        tl.fromTo(
          "#chip",
          { opacity: 0, y: 12, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
          2.4,
        );

        // Proof line clears (matched-velocity settle up + fade) before the lockup builds.
        tl.to("#proofWrap", { opacity: 0, y: -18, duration: 0.5, ease: "power3.in" }, 3.0);

        /* ---------- Phase 2 · Engram wordmark assembles into the lockup ---------- */
        const letters = gsap.utils.toArray("#wordmark .ltr");
        letters.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            3.5 + i * 0.06,
          );
        });
        // coral ✱ spike pops beside the wordmark (scales in, no spin)
        tl.fromTo(
          "#spike",
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
          4.0,
        );

        /* ---------- Phase 3 · tagline per-word + live footer, then settle ---------- */
        const words = gsap.utils.toArray("#tagline .wd");
        words.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            6.0 + i * 0.12,
          );
        });
        tl.fromTo(
          "#footer",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          7.0,
        );

        // Gentle settle on the held lockup — the final read.
        tl.to("#lockupInner", { scale: 0.994, duration: 2.4, ease: "power3.out" }, 7.2);

        // The video's only true exit: a soft fade-out on the final frame.
        tl.to("#lockupWrap", { opacity: 0, duration: 0.55, ease: "power3.in" }, 9.45);

        window.__timelines["10-close"] = tl;
      </script>
    </template>
  </body>
</html>
