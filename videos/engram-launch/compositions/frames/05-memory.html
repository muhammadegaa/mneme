<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata for the source file only; the runtime clones ONLY <template> -->
    <title>04 — The memory (engram_inspect)</title>
  </head>
  <body>
    <template>
      <style>
        /* Root — styled by #root (never a class on the root; the scoper drops that). */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        /* Full-bleed near-black ground — a class="clip" layer, NOT #root. */
        .bg {
          position: absolute;
          inset: 0;
          background: #0e0e10;
        }

        /* Camera stage — hosts the coordinate-target-zoom wrappers. */
        .stage {
          position: absolute;
          inset: 0;
          overflow: hidden; /* zoom > 1 can leak past the frame */
        }
        .zoom-outer {
          width: 100%;
          height: 100%;
          display: grid;
          place-items: center;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .zoom-inner {
          display: grid;
          place-items: center;
          will-change: transform;
        }
        /* Full-frame content plane; the panel sits LEFT (asymmetric 60/40). */
        .content {
          width: 1920px;
          height: 1080px;
          display: flex;
          align-items: center;
          padding-left: 80px;
          box-sizing: border-box;
        }

        /* The terminal / memory panel — warm-navy surface, hairline elevation. */
        .panel {
          width: 1120px;
          background: #1a1a1d;
          border: 1px solid rgba(245, 241, 232, 0.14);
          border-radius: 10px;
          overflow: hidden;
          box-shadow:
            0 1px 3px rgba(14, 14, 16, 0.5),
            0 22px 64px rgba(0, 0, 0, 0.45);
        }
        .titlebar {
          height: 60px;
          display: flex;
          align-items: center;
          padding: 0 28px;
          background: #252120;
          border-bottom: 1px solid rgba(245, 241, 232, 0.1);
          font-family: "JetBrains Mono", monospace;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 0.02em;
          color: #b8b4ac;
        }
        .rows {
          padding: 22px 28px 26px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        /* One memory row: a mono line + a salience bar. */
        .row {
          position: relative;
          display: flex;
          flex-direction: column;
          gap: 10px;
          padding: 8px 0;
        }
        .row-glow {
          position: absolute;
          inset: -14px -24px;
          border-radius: 16px;
          background: radial-gradient(
            ellipse at 22% 50%,
            rgba(255, 92, 87, 0.3),
            rgba(255, 92, 87, 0) 68%
          );
          opacity: 0;
          pointer-events: none;
          z-index: 0;
        }
        .row-line {
          position: relative;
          z-index: 1;
          display: flex;
          align-items: baseline;
          gap: 20px;
          font-family: "JetBrains Mono", monospace;
          font-size: 27px;
          font-weight: 400;
          line-height: 1.2;
          color: #f5f1e8;
        }
        .mem {
          flex: 1 1 auto;
          white-space: nowrap;
          overflow: hidden;
        }
        .kind {
          flex: 0 0 auto;
          width: 150px;
          color: #8a8a8a;
        }
        .seen {
          flex: 0 0 auto;
          width: 150px;
          text-align: right;
          color: #8a8a8a;
        }
        .seen-em {
          display: inline-block;
          transform-origin: right center;
        }

        .bar {
          position: relative;
          z-index: 1;
          width: 100%;
          height: 6px;
          border-radius: 3px;
          background: rgba(245, 241, 232, 0.08);
          overflow: hidden;
        }
        .fill {
          width: 100%;
          height: 100%;
          border-radius: 3px;
          background: #6b6b6e;
          transform: scaleX(0);
          transform-origin: left center;
        }

        /* The mistake row — THE coral moment (voltage reserved for the mistake). */
        .row.mistake .row-line,
        .row.mistake .mem,
        .row.mistake .kind,
        .row.mistake .seen {
          color: #ff5c57;
        }
        .row.mistake .fill {
          background: #ff5c57;
        }

        /* The fading row — grey, near-empty. */
        .row.faded .row-line,
        .row.faded .mem,
        .row.faded .kind,
        .row.faded .seen {
          color: #6f6f72;
        }
        .row.faded .fill {
          background: #55555a;
        }
      </style>

      <div
        id="root"
        data-composition-id="05-memory"
        data-width="1920"
        data-height="1080"
        data-duration="18.975"
      >
        <div class="bg clip" id="bg" data-start="0" data-duration="15.5" data-track-index="0"></div>

        <div class="stage clip" id="stage" data-start="0" data-duration="15.5" data-track-index="1">
          <div class="zoom-outer" id="zoom-outer">
            <div class="zoom-inner" id="zoom-inner">
              <div class="content">
                <div class="panel" id="panel">
                  <div class="titlebar">engram_inspect · backend: qwen</div>
                  <div class="rows">
                    <div class="row mistake" id="row-mistake">
                      <div class="row-glow"></div>
                      <div class="row-line">
                        <span class="mem">forgets null/ok checks on API responses</span>
                        <span class="kind">[mistake]</span>
                        <span class="seen"><span class="seen-em" id="seen-18">seen 18×</span></span>
                      </div>
                      <div class="bar"><div class="fill"></div></div>
                    </div>

                    <div class="row" id="row-project">
                      <div class="row-line">
                        <span class="mem">drops ORM in the request hot path</span>
                        <span class="kind">[project]</span>
                        <span class="seen">seen 1×</span>
                      </div>
                      <div class="bar"><div class="fill"></div></div>
                    </div>

                    <div class="row" id="row-tech">
                      <div class="row-line">
                        <span class="mem">uses Zustand for state management</span>
                        <span class="kind">[tech]</span>
                        <span class="seen">seen 1×</span>
                      </div>
                      <div class="bar"><div class="fill"></div></div>
                    </div>

                    <div class="row" id="row-style">
                      <div class="row-line">
                        <span class="mem">writes functional components with hooks</span>
                        <span class="kind">[style]</span>
                        <span class="seen">seen 1×</span>
                      </div>
                      <div class="bar"><div class="fill"></div></div>
                    </div>

                    <div class="row faded" id="row-bun">
                      <div class="row-line">
                        <span class="mem">uses Bun as the runtime for scripts</span>
                        <span class="kind">[project]</span>
                        <span class="seen">fading</span>
                      </div>
                      <div class="bar"><div class="fill"></div></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (async function () {
          window.__timelines = window.__timelines || {};

          // Metrics must be final before measuring the zoom target.
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }

          // --- Coordinate-target zoom: measure the mistake row, bake the offset ---
          // Measure BEFORE building tweens so fromTo's immediateRender from-state
          // (panel scaled/faded) can't corrupt the resting layout position.
          const S = 1.25; // modest push — keeps every row inside the caption-safe band
          const LAND_Y = 360; // where the mistake row lands after the zoom
          const row = document.getElementById("row-mistake");
          const r = row.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          // Land X at frame center (960); Land Y at LAND_Y. counter = F/S - offset.
          const counterX = (960 - 960) / S - (cx - 960); // = 960 - cx
          const counterY = (LAND_Y - 540) / S - (cy - 540);

          const tl = gsap.timeline({ paused: true });

          // Salience levels (0..1): mistake FULL, single-sightings low, Bun near-empty.
          const LVL = { mistake: 1.0, project: 0.26, tech: 0.26, style: 0.26, bun: 0.06 };

          // ---- Scene 1 (0.0–3.5s): panel establishes, subtle scale-up ----
          tl.fromTo(
            "#panel",
            { scale: 0.94, opacity: 0 },
            { scale: 1, opacity: 1, duration: 1.0, ease: "power3.out" },
            0.2,
          );

          // ---- Scene 2 (3.5–8.0s): rows cascade top→bottom, each bar wipes to level ----
          const cascade = [
            { row: "#row-mistake", fill: "#row-mistake .fill", lvl: LVL.mistake },
            { row: "#row-project", fill: "#row-project .fill", lvl: LVL.project },
            { row: "#row-tech", fill: "#row-tech .fill", lvl: LVL.tech },
            { row: "#row-style", fill: "#row-style .fill", lvl: LVL.style },
            { row: "#row-bun", fill: "#row-bun .fill", lvl: LVL.bun },
          ];
          const REVEAL_START = 3.6;
          const STAGGER = 0.55;
          cascade.forEach((c, i) => {
            const t = REVEAL_START + i * STAGGER;
            tl.fromTo(
              c.row,
              { opacity: 0, y: 18 },
              { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
              t,
            );
            tl.fromTo(
              c.fill,
              { scaleX: 0 },
              { scaleX: c.lvl, duration: 0.7, ease: "power3.out" },
              t + 0.2,
            );
          });

          // ---- Scene 3 (8.0–12.5s): zoom-target the mistake row — lift + coral glow ----
          tl.to("#zoom-outer", { scale: S, duration: 1.5, ease: "power3.inOut" }, 8.2);
          tl.to(
            "#zoom-inner",
            { x: counterX, y: counterY, duration: 1.5, ease: "power3.inOut" },
            8.2,
          );
          // the mistake row lifts a touch
          tl.to("#row-mistake", { y: -6, scale: 1.04, duration: 0.8, ease: "power3.out" }, 8.7);
          // coral bloom blooms behind it
          tl.fromTo(
            "#row-mistake .row-glow",
            { opacity: 0, scale: 0.9 },
            { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" },
            8.7,
          );
          // "seen 18×" scales up — the loud, reinforced memory
          tl.fromTo(
            "#seen-18",
            { scale: 1 },
            { scale: 1.22, duration: 0.7, ease: "power3.out" },
            9.5,
          );

          // ---- Scene 4 (12.5–15.0s): the Bun row recedes; coral 18× stays lit; HOLD ----
          tl.to(
            "#row-bun",
            { opacity: 0.18, scale: 0.96, y: 6, duration: 1.0, ease: "power3.out" },
            12.6,
          );
          tl.fromTo(
            "#row-bun .fill",
            { scaleX: LVL.bun },
            { scaleX: 0.02, duration: 1.0, ease: "power3.out", immediateRender: false },
            12.6,
          );
          // dead-still hold to 15s (no exit tween, no jitter).

          window.__timelines["05-memory"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
