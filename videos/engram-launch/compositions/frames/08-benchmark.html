<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is ignored when this file is mounted as a sub-composition -->
  </head>
  <body>
    <template>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <style>
        /* Fraunces = display/config voice (frame.md). Declared via @font-face local() so the
           renderer supplies it; falls back to the bundled old-style serif (EB Garamond) per
           frame.md's stated fallback. JetBrains Mono (figures/chrome) is auto-resolved by name. */
        @font-face {
          font-family: "Fraunces";
          src: local("Fraunces");
          font-weight: 400 700;
          font-display: swap;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Fraunces", "EB Garamond", serif;
          color: #f5f1e8;
        }
        .clip {
          position: absolute;
          inset: 0;
        }
        /* full-bleed near-black ground — a clip layer, not #root */
        #bg {
          background: #0e0e10;
        }

        .mono {
          font-family: "JetBrains Mono", monospace;
        }

        /* — kicker — */
        .kicker {
          position: absolute;
          top: 92px;
          left: 280px;
          font-size: 28px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          font-weight: 500;
          color: #f5f1e8;
          white-space: nowrap;
        }
        .kicker .spike {
          color: #ff5c57;
          margin-right: 14px;
        }
        .kicker .ctx {
          color: #8a8a8a;
        }

        /* — table — */
        .wrap {
          position: absolute;
          top: 236px;
          left: 280px;
          width: 1360px;
        }
        .thead,
        .row {
          display: grid;
          grid-template-columns: 520px 300px 300px 240px;
          align-items: center;
        }
        .thead {
          height: 64px;
          border-bottom: 1px solid rgba(245, 241, 232, 0.2);
        }
        .row {
          position: relative;
          height: 100px;
          border-bottom: 1px solid rgba(245, 241, 232, 0.1);
        }

        .h {
          font-size: 22px;
          letter-spacing: 0.13em;
          text-transform: uppercase;
          font-weight: 500;
          color: #8a8a8a;
        }
        .h.num-h {
          text-align: right;
          padding-right: 8px;
        }

        /* config column */
        .c-config {
          display: flex;
          align-items: center;
        }
        .tag {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-width: 54px;
          height: 40px;
          padding: 0 12px;
          margin-right: 22px;
          border: 1px solid rgba(245, 241, 232, 0.22);
          border-radius: 6px;
          font-size: 24px;
          font-weight: 500;
          color: #f5f1e8;
        }
        .cfg {
          font-size: 36px;
          letter-spacing: -0.01em;
          color: #f5f1e8;
        }

        /* numeric cells */
        .c-num {
          text-align: right;
          padding-right: 8px;
          font-size: 46px;
          font-weight: 500;
          font-variant-numeric: tabular-nums;
        }
        .numwrap {
          position: relative;
          display: inline-block;
        }
        .num {
          display: inline-block;
          font-variant-numeric: tabular-nums;
          color: #f5f1e8;
        }
        .num.muted {
          color: #8a8a8a;
        }
        .num.win {
          font-size: 50px;
        }

        /* hero (Engram) row spine */
        .lead {
          position: absolute;
          left: -22px;
          top: 14px;
          bottom: 14px;
          width: 5px;
          background: #ff5c57;
          border-radius: 3px;
          transform: scaleY(0);
          transform-origin: center;
        }

        /* token-column emphasis markers */
        .mk-strike {
          position: absolute;
          left: -8px;
          right: -8px;
          top: 52%;
          height: 3px;
          border-radius: 2px;
          background: #ff5c57;
          transform: translateY(-50%) scaleX(0);
          transform-origin: left center;
        }
        .mk-ring {
          position: absolute;
          top: -12px;
          bottom: -12px;
          left: -16px;
          right: -12px;
          border: 2px solid #ff5c57;
          border-radius: 9px;
          transform: scale(0.5);
          opacity: 0;
        }

        /* footnote */
        .foot {
          position: absolute;
          top: 812px;
          left: 280px;
          width: 1360px;
          font-size: 22px;
          letter-spacing: 0.02em;
          color: #8a8a8a;
        }
      </style>

      <div
        id="root"
        data-composition-id="08-benchmark"
        data-width="1920"
        data-height="1080"
        data-duration="16.799"
      >
        <div id="bg" class="clip" data-start="0" data-duration="12.5" data-track-index="0"></div>

        <div id="stage" class="clip" data-start="0" data-duration="12.5" data-track-index="1">
          <div class="kicker mono" id="kicker">
            <span class="spike">&#10033;</span>BENCHMARK<span class="ctx">
              &middot; forgetting-aware retrieval</span
            >
          </div>

          <div class="wrap">
            <div class="thead mono" id="thead">
              <div class="h">Config</div>
              <div class="h num-h">Contradiction acc.</div>
              <div class="h num-h">Stale leakage</div>
              <div class="h num-h">Avg tokens</div>
            </div>

            <!-- A — full-context -->
            <div class="row" id="rowA">
              <div class="c-config">
                <span class="tag mono">A</span><span class="cfg">full-context</span>
              </div>
              <div class="c-num mono">
                <span class="num" id="numAcontra" data-from="0" data-target="50" data-suffix="%" data-at="0.95"
                  >0%</span
                >
              </div>
              <div class="c-num mono">
                <span class="num muted" id="numAstale" data-from="0" data-target="100" data-suffix="%" data-at="0.95"
                  >0%</span
                >
              </div>
              <div class="c-num mono">
                <span class="numwrap"
                  ><span class="num" id="numAtok" data-from="0" data-target="446" data-at="0.95">0</span
                  ><span class="mk-strike" id="strikeA"></span
                ></span>
              </div>
            </div>

            <!-- B — naive top-k -->
            <div class="row" id="rowB">
              <div class="c-config">
                <span class="tag mono">B</span><span class="cfg">naive top-k</span>
              </div>
              <div class="c-num mono">
                <span class="num" id="numBcontra" data-from="0" data-target="50" data-suffix="%" data-at="1.75"
                  >0%</span
                >
              </div>
              <div class="c-num mono">
                <span class="num muted" id="numBstale" data-from="0" data-target="100" data-suffix="%" data-at="1.75"
                  >0%</span
                >
              </div>
              <div class="c-num mono">
                <span class="num" id="numBtok" data-from="0" data-target="64" data-at="1.75">0</span>
              </div>
            </div>

            <!-- B+ — top-k + forget -->
            <div class="row" id="rowBp">
              <div class="c-config">
                <span class="tag mono">B+</span><span class="cfg">top-k + forget</span>
              </div>
              <div class="c-num mono">
                <span class="num win" id="numBpContra" data-from="0" data-target="100" data-suffix="%" data-at="3.55"
                  >0%</span
                >
              </div>
              <div class="c-num mono">
                <span class="num win" id="numBpStale" data-from="100" data-target="0" data-suffix="%" data-at="3.55"
                  >100%</span
                >
              </div>
              <div class="c-num mono">
                <span class="num" id="numBpTok" data-from="0" data-target="69" data-at="3.55">0</span>
              </div>
            </div>

            <!-- C — Engram (hero) -->
            <div class="row" id="rowC">
              <span class="lead" id="leadC"></span>
              <div class="c-config">
                <span class="tag mono">C</span><span class="cfg">Engram</span>
              </div>
              <div class="c-num mono">
                <span class="num win" id="numCcontra" data-from="0" data-target="100" data-suffix="%" data-at="4.95"
                  >0%</span
                >
              </div>
              <div class="c-num mono">
                <span class="num win" id="numCstale" data-from="100" data-target="0" data-suffix="%" data-at="4.95"
                  >100%</span
                >
              </div>
              <div class="c-num mono">
                <span class="numwrap"
                  ><span class="num" id="numCtok" data-from="0" data-target="69" data-at="4.95">0</span
                  ><span class="mk-ring" id="ringC"></span
                ></span>
              </div>
            </div>
          </div>

          <div class="foot mono" id="foot">
            contradiction-recall harness &middot; same corpus &middot; lower avg tokens = cheaper per
            review
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const root = document.querySelector('[data-composition-id="08-benchmark"]');

        // — chrome: kicker, header, footnote —
        tl.fromTo("#kicker", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.0);
        tl.fromTo("#thead", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.4);
        tl.fromTo("#foot", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 7.0);

        // — row reveals (staggered cascade, smooth settle) —
        const ROWS = [
          ["#rowA", 0.8],
          ["#rowB", 1.6],
          ["#rowBp", 3.4],
          ["#rowC", 4.8],
        ];
        ROWS.forEach(([sel, at]) => {
          tl.fromTo(sel, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, at);
        });

        // — count-up every figure; winning 100% / 0% cells snap CORAL —
        const nums = root.querySelectorAll(".num");
        nums.forEach((el) => {
          const from = parseFloat(el.dataset.from || "0");
          const target = parseFloat(el.dataset.target);
          const suf = el.dataset.suffix || "";
          const at = parseFloat(el.dataset.at);
          const st = { v: from };
          el.textContent = Math.round(from) + suf;
          tl.to(
            st,
            {
              v: target,
              duration: 0.9,
              ease: "power3.out",
              onUpdate: () => {
                el.textContent = Math.round(st.v) + suf;
              },
            },
            at,
          );
          if (el.classList.contains("win")) {
            // land, then snap to coral — the jump is the story
            tl.to(el, { color: "#ff5c57", duration: 0.28, ease: "power3.out" }, at + 0.95);
          }
        });

        // — hold on the Engram (C) row lit: panel fill + coral spine —
        tl.to("#rowC", { backgroundColor: "rgba(26,26,29,0.92)", duration: 0.6, ease: "power3.out" }, 6.4);
        tl.fromTo("#leadC", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 6.5);

        // — token-column emphasis: 446 → 69 —
        tl.fromTo("#strikeA", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 7.8);
        tl.to("#numAtok", { color: "#8a8a8a", duration: 0.4, ease: "power3.out" }, 8.0);
        tl.fromTo("#ringC", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 7.9);

        window.__timelines["08-benchmark"] = tl;
      </script>
    </template>
  </body>
</html>
