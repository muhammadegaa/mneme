      <style>
        /* Fonts: EB Garamond (display title) + JetBrains Mono (all node labels).
           Both are bundled in the renderer and resolve by name — no @font-face.
           Coral (#FF5C57) appears ONLY on the "find real mistakes" box outline
           and the final "⚠ catch" box (+ its soft glow). Nothing else is coral.

           LAYOUT LAW (overlap fix): five horizontal bands, each with a clear gap.
             title  60–120  |  WRITE label 166–192  |  WRITE row 216–340
             READ label 386–412  |  READ row 436–560  |  memory 646–754
           No band touches another; captions-safe (everything y <= 896). */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "JetBrains Mono", monospace;
          color: #f5f1e8;
        }
        .clip {
          position: absolute;
          inset: 0;
        }
        /* full-bleed near-black ground — a clip layer, not #root */
        #bg {
          background: #0e0e10;
        }
        .serif {
          font-family: "EB Garamond", Georgia, serif;
        }

        /* — title (top-left) — nothing beside or under it — */
        .title {
          position: absolute;
          top: 60px;
          left: 90px;
          font-size: 54px;
          font-weight: 500;
          letter-spacing: -0.012em;
          color: #f5f1e8;
          white-space: nowrap;
        }

        /* — lane labels (grey, above their row, never touching it) — */
        .lane-label {
          position: absolute;
          left: 90px;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: #8a8a8a;
          white-space: nowrap;
        }
        #wlabel {
          top: 166px;
        }
        #rlabel {
          top: 386px;
        }

        /* — nodes (rounded hairline outlines) — */
        .node {
          position: absolute;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
          background: #1a1a1d;
          border: 1px solid rgba(245, 241, 232, 0.22);
          border-radius: 12px;
        }
        .n-title {
          font-weight: 500;
          letter-spacing: -0.005em;
          color: #f5f1e8;
          white-space: nowrap;
        }
        .n-sub {
          color: #8a8a8a;
          letter-spacing: 0.01em;
          white-space: nowrap;
        }

        /* WRITE row — 3 wide boxes */
        .w-node {
          top: 216px;
          height: 124px;
          width: 520px;
          padding: 0 28px;
          gap: 10px;
        }
        .w-node .n-title {
          font-size: 30px;
        }
        .w-node .n-sub {
          font-size: 17px;
        }
        #w1 {
          left: 90px;
        }
        #w2 {
          left: 700px;
        }
        #w3 {
          left: 1310px;
        }

        /* READ row — 6 narrower boxes */
        .r-node {
          top: 436px;
          height: 124px;
          width: 250px;
          padding: 0 14px;
          gap: 7px;
        }
        .r-node .n-title {
          font-size: 18px;
        }
        .r-node .n-sub {
          font-size: 12px;
        }
        #r1 {
          left: 90px;
        }
        #r2 {
          left: 388px;
        }
        #r3 {
          left: 686px;
        }
        #r4 {
          left: 984px;
        }
        #r5 {
          left: 1282px;
        }
        #r6 {
          left: 1580px;
          border-color: #ff5c57;
        }
        #r6 .n-title .warn {
          color: #ff5c57;
        }

        /* the little bar that grows / the budget meter that fills */
        .r-bar {
          width: 100%;
          height: 10px;
          background: rgba(245, 241, 232, 0.14);
          border-radius: 5px;
          overflow: hidden;
          margin-top: 2px;
        }
        .r-bar-fill {
          width: 100%;
          height: 100%;
          background: #c7c2b7;
          border-radius: 5px;
          transform: scaleX(0);
          transform-origin: left center;
        }

        /* memory box the catch points back to (hairline, NOT coral) */
        .m-node {
          top: 646px;
          left: 1580px;
          width: 250px;
          height: 108px;
          padding: 0 16px;
          gap: 6px;
        }
        .m-node .n-title {
          font-size: 20px;
        }
        .m-node .n-sub {
          font-size: 12px;
        }

        /* soft coral bloom behind the catch (climax) */
        .catch-glow {
          position: absolute;
          left: 1485px;
          top: 328px;
          width: 440px;
          height: 340px;
          border-radius: 50%;
          background: radial-gradient(
            closest-side,
            rgba(255, 92, 87, 0.55),
            rgba(255, 92, 87, 0) 70%
          );
          opacity: 0;
          transform: scale(0.85);
          transform-origin: 50% 50%;
          pointer-events: none;
          will-change: transform, opacity;
        }

        /* arrows drawn on via GSAP strokeDashoffset */
        #arrows {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          pointer-events: none;
        }
        #arrows path {
          fill: none;
          stroke: rgba(245, 241, 232, 0.4);
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
      </style>

      <div
        id="root"
        data-composition-id="03-architecture"
        data-width="1920"
        data-height="1080"
        data-duration="35.401"
      >
        <div id="bg" class="clip" data-start="0" data-duration="35.401" data-track-index="0"></div>

        <div id="stage" class="clip" data-start="0" data-duration="35.401" data-track-index="1">
          <!-- coral bloom behind the catch (z below nodes) -->
          <div class="catch-glow" id="catchglow"></div>

          <!-- arrows (z between bg and nodes) -->
          <svg id="arrows" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
            <path id="aw1" d="M 610 278 L 700 278 M 688 271 L 700 278 L 688 285" />
            <path id="aw2" d="M 1220 278 L 1310 278 M 1298 271 L 1310 278 L 1298 285" />
            <path id="ar1" d="M 340 498 L 388 498 M 376 491 L 388 498 L 376 505" />
            <path id="ar2" d="M 638 498 L 686 498 M 674 491 L 686 498 L 674 505" />
            <path id="ar3" d="M 936 498 L 984 498 M 972 491 L 984 498 L 972 505" />
            <path id="ar4" d="M 1234 498 L 1282 498 M 1270 491 L 1282 498 L 1270 505" />
            <path id="ar5" d="M 1532 498 L 1580 498 M 1568 491 L 1580 498 L 1568 505" />
            <path id="conn" d="M 1705 560 L 1705 646 M 1698 634 L 1705 646 L 1712 634" />
          </svg>

          <!-- title — sentence case, nothing under it -->
          <div class="title serif" id="title">How Engram works</div>

          <!-- WRITE lane -->
          <div class="lane-label" id="wlabel">Write</div>
          <div class="node w-node" id="w1">
            <div class="n-title">commit</div>
            <div class="n-sub">your code</div>
          </div>
          <div class="node w-node" id="w2">
            <div class="n-title">Qwen reads it</div>
            <div class="n-sub">records how you code</div>
          </div>
          <div class="node w-node" id="w3">
            <div class="n-title">find real mistakes</div>
            <div class="n-sub">from the actual code &mdash; never made up</div>
          </div>

          <!-- READ lane -->
          <div class="lane-label" id="rlabel">Read</div>
          <div class="node r-node" id="r1">
            <div class="n-title">rank what matters</div>
            <div class="n-sub">relevant &middot; recent &middot; important</div>
          </div>
          <div class="node r-node" id="r2">
            <div class="n-title">repeats get louder</div>
            <div class="r-bar"><div class="r-bar-fill" id="r2fill"></div></div>
          </div>
          <div class="node r-node" id="r3">
            <div class="n-title">one-offs fade</div>
            <div class="n-sub">used only once</div>
          </div>
          <div class="node r-node" id="r4">
            <div class="n-title">update old notes</div>
            <div class="n-sub">when you change your mind</div>
          </div>
          <div class="node r-node" id="r5">
            <div class="n-title">keep the best</div>
            <div class="n-sub">fits a budget</div>
            <div class="r-bar"><div class="r-bar-fill" id="r5fill"></div></div>
          </div>
          <div class="node r-node" id="r6">
            <div class="n-title"><span class="warn">&#9888;</span> catch</div>
            <div class="n-sub">points to a real memory</div>
          </div>

          <!-- the memory the catch points back to -->
          <div class="node m-node" id="memory">
            <div class="n-title">a real memory</div>
            <div class="n-sub">in your own history</div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // reveal helper — rise + fade, smooth settle (power3, no bounce)
        const RISE = (sel, at, y = 24, dur = 0.6) =>
          tl.fromTo(
            sel,
            { y: y, opacity: 0 },
            { y: 0, opacity: 1, duration: dur, ease: "power3.out" },
            at,
          );

        // arrow draw-on via strokeDashoffset (measured, not CSS)
        const paths = document.querySelectorAll("#arrows path");
        paths.forEach((p) => {
          const len = p.getTotalLength();
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
        });
        const DRAW = (sel, at, dur = 0.5) =>
          tl.to(sel, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);

        // ── chrome ──
        RISE("#title", 0.3, 26, 0.7);

        // ── Scene 1 · WRITE (0–9s), left→right on the spoken clause ──
        RISE("#wlabel", 0.9, 16, 0.5);
        RISE("#w1", 1.4, 24, 0.6); // "When you commit code"
        DRAW("#aw1", 2.5, 0.5);
        RISE("#w2", 3.2, 24, 0.6); // "Qwen reads it and Engram records how you code"
        DRAW("#aw2", 4.6, 0.5);
        RISE("#w3", 5.4, 24, 0.6); // "Mistakes are found directly in the real code"
        // "so they are never made up" — outline turns coral
        tl.to("#w3", { borderColor: "#ff5c57", duration: 0.6, ease: "power2.out" }, 7.4);

        // ── Scene 2 · READ (9–26s), box-by-box on each clause ──
        RISE("#rlabel", 9.3, 16, 0.5); // "when you're about to ship a change"
        RISE("#r1", 10.2, 24, 0.6); // "ranks what it knows — relevant, recent, important"
        DRAW("#ar1", 11.5, 0.45);
        RISE("#r2", 12.3, 24, 0.6); // "repeat a mistake and its memory grows stronger"
        tl.fromTo("#r2fill", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.out" }, 13.0);
        DRAW("#ar2", 14.1, 0.45);
        RISE("#r3", 14.9, 24, 0.6); // "do something once and it fades"
        tl.to("#r3", { opacity: 0.4, duration: 0.9, ease: "power2.out" }, 15.9); // the box dims
        DRAW("#ar3", 16.7, 0.45);
        RISE("#r4", 17.5, 24, 0.6); // "change your mind, and the old note is replaced"
        DRAW("#ar4", 19.2, 0.45);
        RISE("#r5", 20.0, 24, 0.6); // "keeps only the most useful that fit a small budget"
        tl.fromTo(
          "#r5fill",
          { scaleX: 0 },
          { scaleX: 0.68, duration: 0.9, ease: "power2.out" },
          20.8,
        ); // meter fills to the budget
        DRAW("#ar5", 22.4, 0.45);
        RISE("#r6", 23.4, 24, 0.6); // "every warning points back to a specific memory"

        // ── Scene 3 · CATCH (26–35s) — coral bloom, hairline back to memory, hold ──
        tl.fromTo(
          "#catchglow",
          { opacity: 0, scale: 0.85 },
          { opacity: 0.4, scale: 1, duration: 0.9, ease: "power2.out" },
          23.8,
        );
        DRAW("#conn", 25.4, 0.5); // hairline draws from catch back to the memory
        RISE("#memory", 26.3, 24, 0.6);
        // hold on the assembled pipeline through 34.901 (clip data-duration holds the last frame)

        window.__timelines["03-architecture"] = tl;
      </script>
    </template>
  </body>
