<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata for the source file only; the runtime clones ONLY <template>. -->
  </head>
  <body>
    <template>
      <style>
        /* Fraunces (brand display serif) — embedded at build time so it renders
           deterministically offline / on cloud. woff2 is the latin variable subset. */
        @font-face {
          font-family: "Fraunces";
          font-style: normal;
          font-weight: 400 500;
          font-display: swap;
          src: url("https://fonts.gstatic.com/s/fraunces/v38/6NUu8FyLNQOQZAnv9bYEvDiIdE9Ea92uemAk_WBq8U_9v0c2Wa0K7iN7hzFUPJH58nib14c7qv8oRcTn.woff2")
            format("woff2");
        }

        /* Root styled by #root (never a class) — the compiler scopes each file's CSS
           to its data-composition-id, so a root class stops matching. */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .clip {
          position: absolute;
        }

        /* Full-bleed near-black ground as its own clip layer (not #root). */
        .bg {
          top: 0;
          left: 0;
          width: 1920px;
          height: 1080px;
          background: #0e0e10;
        }

        /* Caption-safe stage: content confined to the top ~83% (y <= 896px),
           centered within that band. */
        .stage {
          top: 0;
          left: 0;
          width: 1920px;
          height: 896px;
          display: grid;
          place-items: center;
          padding: 0 160px;
          box-sizing: border-box;
        }

        /* Pain lines — Fraunces display, sentence case, cream, negative-tracked. */
        .pain {
          font-family: "Fraunces", Georgia, serif;
          font-weight: 400;
          font-size: 152px;
          line-height: 1.0;
          letter-spacing: -0.03em;
          color: #f5f1e8;
          text-align: center;
          white-space: nowrap;
          will-change: transform, opacity;
        }

        /* The lint-underline mechanic — a real element so scaleX/backgroundColor seek cleanly. */
        .uword {
          position: relative;
          white-space: nowrap;
        }
        .uline {
          position: absolute;
          left: 0;
          bottom: -0.16em;
          height: 7px;
          width: 100%;
          border-radius: 4px;
          background: #ff5c57; /* coral — the flagged mistake */
          transform: scaleX(0);
          transform-origin: left center;
        }
        .uline.muted {
          background: #8a8a8a; /* dismissed / greyed out */
        }

        /* The turn — assembles per-word; "keep doing this" lands coral. */
        .turn {
          font-family: "Fraunces", Georgia, serif;
          font-weight: 400;
          font-size: 108px;
          line-height: 1.12;
          letter-spacing: -0.02em;
          text-align: center;
        }
        .turn .row {
          display: block;
        }
        .tw {
          display: inline-block;
          will-change: transform, opacity;
        }
        .cream {
          color: #f5f1e8;
        }
        .coral {
          color: #ff5c57;
        }
      </style>

      <div
        id="root"
        data-composition-id="01-problem"
        data-width="1920"
        data-height="1080"
        data-duration="19.387"
      >
        <!-- Persistent ground layer. -->
        <div id="bg" class="bg clip" data-start="0" data-duration="12.4" data-track-index="0"></div>

        <!-- Beat 1 — "A linter flags it once." -->
        <div id="beat-1" class="stage clip" data-start="0" data-duration="2.15" data-track-index="1">
          <div class="pain" id="l1">
            A linter <span class="uword">flags<span class="uline" id="l1u"></span></span> it once.
          </div>
        </div>

        <!-- Beat 2 — hard cut → "You mute it." -->
        <div id="beat-2" class="stage clip" data-start="2.2" data-duration="2.35" data-track-index="1">
          <div class="pain" id="l2">
            You <span class="uword">mute<span class="uline muted" id="l2u"></span></span> it.
          </div>
        </div>

        <!-- Beat 3 — hard cut → "You ship it again." (the loop closes) -->
        <div id="beat-3" class="stage clip" data-start="4.6" data-duration="2.5" data-track-index="1">
          <div class="pain" id="l3">You ship it again.</div>
        </div>

        <!-- Beat 4 — the turn, assembled per-word. -->
        <div id="beat-4" class="stage clip" data-start="7.2" data-duration="5.2" data-track-index="1">
          <div class="turn" id="turn">
            <span class="row"
              ><span class="tw cream">Nothing</span> <span class="tw cream">remembers</span>
              <span class="tw cream">that</span> <span class="tw cream">you</span></span
            >
            <span class="row"
              ><span class="tw coral">keep</span> <span class="tw coral">doing</span>
              <span class="tw coral">this.</span></span
            >
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* — Beat 1: linter flags it once — kinetic settle (power3, no bounce) — */
        tl.fromTo(
          "#l1",
          { opacity: 0, y: 44, scale: 1.06 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
          0.1,
        );
        // coral lint-underline flicks in under "flags"
        tl.fromTo(
          "#l1u",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.34, ease: "power3.out" },
          0.72,
        );
        // …then greys out as it gets muted
        tl.to("#l1u", { backgroundColor: "#8a8a8a", duration: 0.4, ease: "power2.inOut" }, 1.45);

        /* — Beat 2: you mute it — hard cut, the underline already dismissed (grey) — */
        tl.fromTo(
          "#l2",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" },
          2.2,
        );
        tl.fromTo(
          "#l2u",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.26, ease: "power3.out" },
          2.42,
        );

        /* — Beat 3: you ship it again — hard cut; same three-beat rhythm closes the loop — */
        tl.fromTo(
          "#l3",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" },
          4.6,
        );

        /* — Beat 4: the turn — per-word staggered reveal; coral words land on cue — */
        tl.fromTo(
          "#turn .cream",
          { opacity: 0, y: 38 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.13 },
          7.35,
        );
        tl.fromTo(
          "#turn .coral",
          { opacity: 0, y: 38, scale: 1.14 },
          { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out", stagger: 0.16 },
          8.28,
        );

        /* — Settle-and-hold: one low-amplitude breath, finite (deterministic) — */
        const holdStart = 9.35,
          cycle = 1.2,
          holdDur = 12 - holdStart;
        tl.to(
          "#turn",
          {
            scale: 1.006,
            duration: cycle / 2,
            ease: "sine.inOut",
            yoyo: true,
            repeat: Math.max(0, Math.floor(holdDur / cycle) - 1),
          },
          holdStart,
        );

        window.__timelines["01-problem"] = tl;
      </script>
    </template>
  </body>
</html>
