# Serverless Devs config — deploy Engram to Alibaba Cloud Function Compute (FC 3.0).
# Custom-container HTTP function built from the repo Dockerfile.
#
#   npm i -g @serverless-devs/s
#   s config add            # set AccessKey ID/Secret (alias: default)
#   export DASHSCOPE_API_KEY=...   DASHSCOPE_BASE_URL=...   OSS_* ...
#   s deploy
#
# Secrets are read from your shell env (${env.X}) — never committed.
edition: 3.0.0
name: engram
access: default

vars:
  region: ap-southeast-1   # Singapore — match your Qwen workspace + OSS bucket

resources:
  engram:
    component: fc3
    props:
      region: ${vars.region}
      functionName: engram
      description: Engram — MemoryAgent backend (Hono API + Memory Inspector UI)
      runtime: custom-container
      cpu: 0.5
      memorySize: 1024
      diskSize: 512
      timeout: 120
      customContainerConfig:
        # `s deploy` builds this image from ./Dockerfile and pushes to ACR.
        image: registry.${vars.region}.cr.aliyuncs.com/${vars.region}/engram:latest
        port: 9000           # FC sends requests here; server reads FC_SERVER_PORT
      environmentVariables:
        FC_SERVER_PORT: "9000"
        ENGRAM_BACKEND: qwen
        MEMORY_STORE: memory          # use postgres + DATABASE_URL for persistence
        DASHSCOPE_API_KEY: ${env.DASHSCOPE_API_KEY}
        DASHSCOPE_BASE_URL: ${env.DASHSCOPE_BASE_URL}
        OSS_REGION: ${env.OSS_REGION}
        OSS_BUCKET: ${env.OSS_BUCKET}
        OSS_ACCESS_KEY_ID: ${env.OSS_ACCESS_KEY_ID}
        OSS_ACCESS_KEY_SECRET: ${env.OSS_ACCESS_KEY_SECRET}
      triggers:
        - triggerName: http
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: [GET, POST]
